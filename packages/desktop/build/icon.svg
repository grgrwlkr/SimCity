<?xml version="1.0" encoding="UTF-8"?>
<!-- SimCity app icon. Source for build/icon.icns (scripts/build-icon.sh).
     Visual language of docs/design/hud: the smoked-glass panel (tokens.md, "Стекло без размытия")
     carrying a skyline drawn like the tool sprite (24-unit grid, round caps and joins).
     Colours are HUD tokens only (tokens.md): hud-glass-solid, hud-glass-highlight,
     hud-glass-border, hud-ink, hud-accent, hud-warning. Canvas 1024, tile 824 on the macOS
     icon grid. XML forbids a double hyphen inside a comment, hence the token names without it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- glass: solid fill, sheen fading out at 35 % height, 12 % white rim -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0f141c"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

  <!-- skyline on the 24-unit icon grid, 1 unit = 24 px, live area 20 units -->
  <g transform="translate(224 212) scale(24)">
    <g fill="none" stroke="#f2f5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 20v-7h4v7"/>
      <path d="M10 20V6h4.5v14"/>
      <path d="M12.25 6V3"/>
      <path d="M16.5 20V10H20v10"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffc74d">
      <rect x="11.3" y="8.6" width="1" height="1.3" rx="0.3"/>
      <rect x="13" y="11.4" width="1" height="1.3" rx="0.3"/>
      <rect x="11.3" y="14.2" width="1" height="1.3" rx="0.3"/>
      <rect x="5" y="15.4" width="1" height="1.3" rx="0.3"/>
      <rect x="17.75" y="12.6" width="1" height="1.3" rx="0.3"/>
    </g>
    <!-- the street -->
    <path d="M2 20h20" fill="none" stroke="#5c9eff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
