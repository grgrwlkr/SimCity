<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimCity</title>
    <meta name="theme-color" content="#dce8e3" />
  </head>
  <body>
    <main id="main-menu" class="menu">
      <span class="brand-mark" aria-hidden="true">s</span>
      <h1>SimCity</h1>
      <nav aria-label="Главное меню">
        <button id="resume-region" type="button" hidden>Продолжить</button>
        <a id="open-region" href="/?seed=689856" aria-label="Создать регион">
          <strong>Создать регион</strong>
          <span>Основывай поселения, строй дороги и планируй города</span>
        </a>
        <button
          id="menu-load-region"
          type="button"
          aria-expanded="false"
          aria-controls="saved-regions"
        >
          Загрузить
        </button>
      </nav>
      <section id="saved-regions" aria-labelledby="saves-title" hidden>
        <div class="saves-heading">
          <h2 id="saves-title">Сохранённые регионы</h2>
          <button
            id="refresh-saves"
            type="button"
            aria-label="Обновить список сохранений"
          >
            Обновить
          </button>
        </div>
        <p id="saves-status" role="status" aria-live="polite"></p>
        <ul id="save-list" aria-label="Список сохранений"></ul>
      </section>
      <a class="prototype-link" id="open-city" href="/city/?seed=689856"
        >Город у воды — прототип</a
      >
      <p id="shell-status" role="status"></p>
      <p id="menu-hint" class="hint">Enter — создать регион</p>
    </main>
    <section id="game-shell" hidden inert></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
