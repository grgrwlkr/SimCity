[package]
name = "simcity"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
bevy_egui = "0.38"
rand = "0.8"
ron = "0.8"
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

# Enable a small amount of optimization in debug mode for dependencies, which helps Bevy a lot.
[profile.dev.package."*"]
opt-level = 3
