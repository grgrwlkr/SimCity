[workspace]
resolver = "3"
members = [
    "crates/simcity_core",
    "crates/simcity_sim",
    "crates/simcity_frontend",
    "crates/simcity_data",
    "crates/simcity_debug",
]

[workspace.dependencies]
bevy = { version = "0.19.0", features = ["bevy_remote"] }
bevy_egui = "0.40.0"
rand = "0.10.1"
ron = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"

[package]
name = "simcity_app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "simcity"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true }
rand = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simcity_core = { path = "crates/simcity_core" }
simcity_data = { path = "crates/simcity_data" }
simcity_debug = { path = "crates/simcity_debug" }
simcity_frontend = { path = "crates/simcity_frontend" }
simcity_sim = { path = "crates/simcity_sim" }

[features]
# Enables Bevy's `dynamic_linking` for faster iteration in dev builds:
# `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

# Official Bevy profiling backends (built-in tracing spans):
# - Tracy (recommended): `cargo run --release --features profile_tracy`
# - Tracy + memory:      `cargo run --release --features profile_tracy_memory`
# - Chrome trace:        `cargo run --release --features profile_chrome`
profile_tracy = ["bevy/trace_tracy"]
profile_tracy_memory = ["bevy/trace_tracy", "bevy/trace_tracy_memory"]
profile_chrome = ["bevy/trace_chrome"]

[profile.dev]
opt-level = 1

# Enable a small amount of optimization in debug mode for dependencies, which helps Bevy a lot.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
