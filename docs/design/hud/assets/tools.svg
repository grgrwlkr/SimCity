<?xml version="1.0" encoding="UTF-8"?>
<!-- HUD icon sprite, stage 6c. Geometry: 24x24 viewBox, 20x20 live area (2 px padding),
     stroke 2, round caps and joins, currentColor, no fills except where stated.
     Use: <svg class="hud-icon" aria-hidden="true"><use href="/icons/tools.svg#tool-road-2"/></svg>
     See docs/design/hud/icons.md. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .solid { fill: currentColor; stroke: none; }
      .thin { stroke-width: 1.5; }
    </style>
  </defs>

