<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Зоны экрана HUD, 1280×800</title>
  <rect width="1280" height="800" fill="#1c2a1e"/>
  <g fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="4 4">
    <rect x="0" y="0" width="1280" height="56"/>
    <rect x="0" y="704" width="1280" height="96"/>
  </g>
  <g font-size="11" fill="#ffffff" fill-opacity=".55">
    <text x="12" y="20">верхняя полоса HUD, 56 px</text>
    <text x="12" y="724">нижняя полоса HUD, 96 px</text>
    <text x="540" y="400">игровое поле — кликается, здесь строят</text>
  </g>
  <g fill="#0f141c" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".12" rx="12">
    <rect x="404" y="12" width="472" height="40" rx="12"/>
    <rect x="12" y="72" width="260" height="200" rx="12"/>
    <rect x="12" y="352" width="420" height="180" rx="12"/>
    <rect x="948" y="72" width="320" height="120" rx="12"/>
    <rect x="300" y="668" width="680" height="120" rx="12"/>
    <rect x="360" y="72" width="560" height="420" rx="12" fill-opacity=".92"/>
  </g>
  <g font-size="13" fill="#f2f5fa">
    <text x="420" y="37">HUD-бар · сверху по центру · top 12</text>
    <text x="24" y="94">Карты данных · left 12, top 72 · 260 px</text>
    <text x="24" y="374">Советник · left 12, top 352 · 420 px</text>
    <text x="960" y="94">Тосты · right 12, top 72 · до 4 строк</text>
    <text x="316" y="692">Палитра инструментов · снизу по центру · bottom 12</text>
    <text x="376" y="94">Экран бюджета · по центру, top 72 · 560 px · модальный</text>
    <text x="376" y="114" font-size="11" fill="#b3bac7">поверх него скрим; подсказка у клетки идёт за курсором и стоит выше всех панелей</text>
  </g>
  <g stroke="#5c9eff" stroke-width="1" fill="none" stroke-dasharray="3 3">
    <rect x="12" y="12" width="1256" height="776"/>
  </g>
  <text x="18" y="784" font-size="11" fill="#5c9eff">безопасная зона: 12 px от края окна (16 px при pointer: coarse)</text>
</svg>
