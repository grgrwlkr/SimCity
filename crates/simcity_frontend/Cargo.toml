[package]
name = "simcity_frontend"
version = "0.1.0"
edition = "2024"

[features]
# The egui developer panels (FPS and MCP status, map seed, Load Test City, debug dump, UI
# settings knobs). Enabled transitively by the root `dev` feature; a player build gets only the
# game interface.
dev = []

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
simcity_core = { path = "../simcity_core" }
simcity_data = { path = "../simcity_data" }
simcity_debug = { path = "../simcity_debug" }
simcity_sim = { path = "../simcity_sim" }
